name: PR Checks

on:
  pull_request:
    branches:
      - main   # or whichever branch you target for PRs

jobs:

  pr-title-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        run: |
          echo "Checking PR title: ${{ github.event.pull_request.title }}"
          TITLE="${{ github.event.pull_request.title }}"

          # Regex for tag + number + colon + context
          if [[ ! "$TITLE" =~ ^(Feature|Fix|Enhancement|Docs|Test|Chore|Build|Security|Performance|Release)[[:space:]]*-[[:space:]]*[0-9]{3,4}[[:space:]]*:[[:space:]].+$ ]]; then
            echo "Invalid PR title format."
            exit 1
          fi

          CONTEXT=$(echo "$TITLE" | sed -E 's/^(Feature|Fix|Enhancement|Docs|Test|Chore|Build|Security|Performance|Release)[[:space:]]*-[[:space:]]*[0-9]{3,4}[[:space:]]*:[[:space:]]*(.*)$/\2/')
          LEN=${#CONTEXT}
          if [ $LEN -lt 20 ] || [ $LEN -gt 120 ]; then
            echo "Invalid PR context length."
            exit 1
          fi

          echo "PR title is valid."
  
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
        # Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3

        # Setup Python (since your project is Python-based)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

        # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # Run linting (flake8 or pylint)
      - name: Run lint checks
        run: |
          pip install flake8
          flake8 backend/src/ --count --select=E9,F63,F7,F82 --show-source --statistics

        # Run tests (pytest)
      - name: Run tests
        run: |
          pip install pytest

  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run lint checks
        run: |
          pip install flake8
          flake8 backend/src/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run pytest
        run: |
          pip install pytest
          pytest backend/tests/ -v

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci